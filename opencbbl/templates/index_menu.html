<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Applications</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .menu-item {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        .menu-item h2 {
            margin-bottom: 10px;
            color: #667eea;
            font-size: 1.5em;
        }
        .menu-item p {
            color: #666;
            font-size: 0.9em;
            line-height: 1.5;
        }
        .icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Demo Applications</h1>
        <div class="menu">
            <a href="/black-list-cbrf/" class="menu-item">
                <div class="icon">🏦</div>
                <h2>Черный список ЦБ РФ</h2>
                <p>Проверка организаций по списку ЦБ РФ</p>
            </a>
            <a href="/pcmanager/" class="menu-item">
                <div class="icon">💻</div>
                <h2>PC Manager</h2>
                <p>Управление компьютерами и сборками</p>
            </a>
            <a href="/pcmanager/inventory/" class="menu-item">
                <div class="icon">📦</div>
                <h2>Inventory</h2>
                <p>Складской учет комплектующих</p>
            </a>
            <a href="/pcmanager/builds/" class="menu-item">
                <div class="icon">🔧</div>
                <h2>Builds</h2>
                <p>Сборка и конфигурация ПК</p>
            </a>
            <a href="/admin/" class="menu-item">
                <div class="icon">⚙️</div>
                <h2>Admin Panel</h2>
                <p>Панель администратора Django</p>
            </a>
        </div>
    </div>
</body>
</html>
