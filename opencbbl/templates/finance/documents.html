{% extends 'base.html' %}

{% block content %}
<h2>Финансы</h2>

<ul class="nav nav-tabs mb-4">
    <li class="nav-item">
        <a class="nav-link" href="{% url 'finance_operations' %}">Операции</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="{% url 'finance_statistics' %}">Статистика</a>
    </li>
    <li class="nav-item">
        <a class="nav-link active" href="{% url 'documents_index' %}">Документы</a>
    </li>
</ul>

<h3>Документы</h3>

<div class="row">
    {% for cat in categories %}
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <h5>{{ cat.name }}</h5>
                <p class="text-muted">{{ cat.description|truncatewords:20 }}</p>
                <a href="{% url 'documents_category' cat.slug %}" class="btn btn-primary">Открыть</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <p class="text-muted">Нет категорий документов</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
